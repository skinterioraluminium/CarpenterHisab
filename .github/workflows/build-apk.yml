name: Build CarpenterHisab APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q CarpenterHisab_SK_Interior_Aluminium_Source.zip -d source

      - name: Replace KSP with KAPT
        working-directory: source/CarpenterHisab_Android
        run: |
          sed -i 's/com.google.devtools.ksp/org.jetbrains.kotlin.kapt/g' build.gradle.kts
          sed -i 's/com.google.devtools.ksp/org.jetbrains.kotlin.kapt/g' app/build.gradle.kts
          sed -i 's/ksp(/kapt(/g' app/build.gradle.kts

      - name: Build APK
        working-directory: source/CarpenterHisab_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Interior-Aluminium-APK
          path: source/CarpenterHisab_Android/app/build/outputs/apk/debug/app-debug.apk
